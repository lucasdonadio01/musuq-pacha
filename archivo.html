OWN-WORLD: Papel claro rugoso sobre pequeños cuadrados sólidos. Space Grotesk, negro, naranja y violeta del home.
STORY: Pueblo → montón abierto → documento levantado, con su fuente al lado.
FIRST VIEWPORT: Ocho grupos sueltos, rótulos apoyados; la interfaz deja el centro a los materiales.
