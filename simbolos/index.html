<canvas id="fondo" aria-hidden="true"></canvas>
<audio id="musica" src="audio/shasta.mp3?v=18" loop preload="auto"></audio>

<section id="portada">
  <canvas id="mosaico" aria-hidden="true"></canvas>
  <div class="bloque" id="bloque">
    <h1 class="titulo">MUSUQ PACHA</h1>
    <p class="bajada">Generador de símbolos para pueblos originarios</p>
    <button class="boton boton--grande" id="entrar">empezar</button>
  </div>
</section>

<div class="overlay" id="exportar" hidden>
  <div class="overlay__caja" role="dialog" aria-modal="true" aria-labelledby="tituloExport">
    <h2 class="overlay__titulo" id="tituloExport">¿En qué formato lo bajás?</h2>
    <div class="formatos">
      <button class="formato" data-formato="9:16">
        <span class="marco marco--historia"></span>
        <b>Historia</b><i>9 : 16</i>
      </button>
      <button class="formato" data-formato="1:1">
        <span class="marco marco--cuadrado"></span>
        <b>Cuadrado</b><i>1 : 1</i>
      </button>
    </div>
    <button class="boton" id="cancelarExport">cancelar</button>
  </div>
</div>

<div id="cursor" aria-hidden="true" hidden><span><svg class="ic"><use href="#ic-pincel"/></svg></span></div>

<main id="taller" hidden>
  <header class="barra">
    <button class="icono barra__volver" id="volver" aria-label="Elegir pueblo">
      <svg class="ic"><use href="#ic-volver"/></svg>
    </button>
    <span class="marca">MUSUQ PACHA</span>
    <small class="barra__sub">generador de símbolos</small>
    <span class="barra__pueblo" id="puebloActual"></span>
    <span class="barra__sep"></span>
    <span class="icono icono--falso" title="Accesibilidad" aria-hidden="true">
      <svg class="ic"><use href="#ic-accesibilidad"/></svg>
    </span>
    <button class="icono" id="sonido" aria-pressed="false" title="Silenciar música" aria-label="Silenciar música">
      <svg class="ic"><use href="#ic-sonido"/></svg>
    </button>
  </header>

  <aside class="rail rail--izq" id="menu">
    <button class="icono menu__cerrar" id="cerrarMenu" aria-label="Cerrar">
      <svg class="ic"><use href="#ic-cerrar"/></svg>
    </button>
    <h2 class="rotulo">pueblo</h2>
    <ul class="pueblos" id="listaPueblos"></ul>
    <h2 class="rotulo">territorio</h2>
    <canvas class="mapa" id="mapa"></canvas>
    <p class="mapa__pie" id="mapaPie"></p>
  </aside>

  <section class="escena">
    <canvas id="lienzo"></canvas>
    <div class="acciones">
      <button class="accion accion--fuerte" id="generar" title="Generar otro símbolo (G)" aria-label="Generar otro símbolo">
        <svg class="ic"><use href="#ic-generar"/></svg>
      </button>
      <button class="accion" id="png" title="Descargar PNG" aria-label="Descargar PNG">
        <svg class="ic"><use href="#ic-descargar"/></svg>
      </button>
      <button class="accion accion--peligro" id="limpiar" title="Vaciar el lienzo" aria-label="Vaciar el lienzo">
        <svg class="ic"><use href="#ic-vaciar"/></svg>
      </button>
    </div>
    <p class="estado" id="estado" role="status" aria-live="polite"></p>
  </section>

  <aside class="rail rail--der">
    <h2 class="rotulo">herramienta</h2>
    <div class="segm" id="modos">
      <button data-modo="pincel" aria-pressed="true" title="Pincel (Q)" aria-label="Pincel">
        <svg class="ic"><use href="#ic-pincel"/></svg><small>q</small>
      </button>
      <button data-modo="borrador" aria-pressed="false" title="Borrador (W)" aria-label="Borrador">
        <svg class="ic"><use href="#ic-borrador"/></svg><small>w</small>
      </button>
      <button data-modo="seleccion" aria-pressed="false" title="Selección (E)" aria-label="Selección">
        <svg class="ic"><use href="#ic-seleccion"/></svg><small>e</small>
      </button>
      <button data-modo="cuentagotas" aria-pressed="false" title="Copiar color (I)" aria-label="Copiar color">
        <svg class="ic"><use href="#ic-cuentagotas"/></svg><small>i</small>
      </button>
    </div>

    <h2 class="rotulo">colores del territorio</h2>
    <div class="paleta" id="paleta">
      <label class="mas" title="Cualquier color" aria-label="Cualquier color">
        <svg class="ic"><use href="#ic-mas"/></svg>
        <input type="color" id="colorLibre" value="#B5654A">
      </label>
    </div>
    <p class="fila nota"><span id="notaColor">—</span></p>

    <h2 class="rotulo">lienzo</h2>
    <label class="fila"><span>fondo</span><input type="color" id="colorFondo" value="#F2EDE5"></label>
    <label class="fila"><span>grilla</span>
      <select id="lado">
        <option value="7">7 × 7</option>
        <option value="9">9 × 9</option>
        <option value="11" selected>11 × 11</option>
        <option value="13">13 × 13</option>
      </select>
    </label>
    <label class="fila"><span>espejo al pintar</span><input type="checkbox" id="espejo" checked></label>
  </aside>

</main>

<script src="js/pueblos.js?v=18"></script>
<script src="js/mapa.js?v=18"></script>
<script src="js/motor.js?v=18"></script>
<script src="js/fondo.js?v=18"></script>
<script src="js/simbolo.js?v=18"></script>
<script src="js/mosaico.js?v=18"></script>
<script src="js/app.js?v=18"></script>
</body>
</html>
